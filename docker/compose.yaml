services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assignment
      POSTGRES_USER: assignment
      POSTGRES_PASSWORD: assignment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignment -d assignment"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assignment
      SPRING_DATASOURCE_USERNAME: assignment
      SPRING_DATASOURCE_PASSWORD: assignment
      BROKERAGE_BASE_URL: ${BROKERAGE_BASE_URL:-https://brokerage.example}
      BROKERAGE_TOKEN_PATH: ${BROKERAGE_TOKEN_PATH:-/oauth2/token}
      BROKERAGE_ORDER_PATH: ${BROKERAGE_ORDER_PATH:-/v1/orders}
      BROKERAGE_ORDER_STATUS_PATH: ${BROKERAGE_ORDER_STATUS_PATH:-/v1/orders/{orderId}}
      BROKERAGE_TIMEOUT_MS: ${BROKERAGE_TIMEOUT_MS:-5000}
      BROKERAGE_APP_KEY: ${BROKERAGE_APP_KEY:-demo-app-key}
      BROKERAGE_APP_SECRET: ${BROKERAGE_APP_SECRET:-demo-app-secret}
      BROKERAGE_CLIENT_ID: ${BROKERAGE_CLIENT_ID:-assignment-client}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
