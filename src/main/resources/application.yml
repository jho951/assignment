spring:
  application:
    name: assignment

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/assignment;MODE=PostgreSQL;DATABASE_TO_UPPER=false}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

brokerage:
  base-url: ${BROKERAGE_BASE_URL:https://brokerage.example}
  token-path: ${BROKERAGE_TOKEN_PATH:/oauth2/token}
  order-path: ${BROKERAGE_ORDER_PATH:/v1/orders}
  order-status-path: ${BROKERAGE_ORDER_STATUS_PATH:/v1/orders/{orderId}}
  timeout-ms: ${BROKERAGE_TIMEOUT_MS:5000}
  app-key: ${BROKERAGE_APP_KEY:demo-app-key}
  app-secret: ${BROKERAGE_APP_SECRET:demo-app-secret}
  client-id: ${BROKERAGE_CLIENT_ID:assignment-client}

jobs:
  max-attempts: ${JOB_MAX_ATTEMPTS:3}
  poll-interval-ms: ${JOB_POLL_INTERVAL_MS:1000}
  batch-size: ${JOB_BATCH_SIZE:10}
  lease-timeout-ms: ${JOB_LEASE_TIMEOUT_MS:60000}
  cleanup-interval-ms: ${JOB_CLEANUP_INTERVAL_MS:60000}
  scheduling-enabled: ${JOB_SCHEDULING_ENABLED:true}
  executor:
    core-size: ${JOB_EXECUTOR_CORE_SIZE:2}
    max-size: ${JOB_EXECUTOR_MAX_SIZE:4}
    queue-capacity: ${JOB_EXECUTOR_QUEUE_CAPACITY:100}
