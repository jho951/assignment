spring:
  application:
    name: assignment

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/assignment;MODE=PostgreSQL;DATABASE_TO_UPPER=false}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

worker:
  base-url: ${WORKER_BASE_URL:https://dev.realteeth.ai/mock}
  issue-key-path: ${WORKER_ISSUE_KEY_PATH:/auth/issue-key}
  process-path: ${WORKER_PROCESS_PATH:/process}
  timeout-ms: ${WORKER_TIMEOUT_MS:5000}
  candidate-name: ${WORKER_CANDIDATE_NAME:이장호}
  candidate-email: ${WORKER_CANDIDATE_EMAIL:jho951@naver.com}

jobs:
  max-attempts: ${JOB_MAX_ATTEMPTS:3}
  poll-interval-ms: ${JOB_POLL_INTERVAL_MS:1000}
  batch-size: ${JOB_BATCH_SIZE:10}
  lease-timeout-ms: ${JOB_LEASE_TIMEOUT_MS:60000}
  cleanup-interval-ms: ${JOB_CLEANUP_INTERVAL_MS:60000}
  scheduling-enabled: ${JOB_SCHEDULING_ENABLED:true}
  executor:
    core-size: ${JOB_EXECUTOR_CORE_SIZE:2}
    max-size: ${JOB_EXECUTOR_MAX_SIZE:4}
    queue-capacity: ${JOB_EXECUTOR_QUEUE_CAPACITY:100}
